name: Discord notifications
description: Post new issues, pull requests, discussions, releases, and security advisories to a Discord channel
inputs:
  webhook-url:
    description: Discord webhook URL for the channel; store it as a secret
    required: true
  event:
    description: Event name to format the payload as; defaults to the event that triggered the workflow
    required: false
    default: ''
  payload-path:
    description: File of one or more event payloads, one message each; defaults to the triggering event's payload
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Send to Discord
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook-url }}
        EVENT: ${{ inputs.event }}
        PAYLOAD: ${{ inputs.payload-path }}
      run: |
        EVENT="${EVENT:-$GITHUB_EVENT_NAME}" PAYLOAD="${PAYLOAD:-$GITHUB_EVENT_PATH}" \
          bash "$GITHUB_ACTION_PATH/post.sh"
